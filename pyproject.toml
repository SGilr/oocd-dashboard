[project]
name = "oocd-etl"
version = "1.0.0"
description = "ETL for the out of court disposals dashboard"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["etl/tests"]
