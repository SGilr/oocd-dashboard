name: Parse check, temporary

# TEMPORARY. Delete before this branch is merged.
#
# workflow_dispatch only works on a workflow that is already on the default
# branch, so prison-figures.yml cannot be triggered by hand until it is merged.
# The first parse confirmation has to happen before then, because the row
# labels in etl/prison_capacity.py were written without sight of the bulletin
# and gov.uk is unreachable from every environment that has worked on this.
#
# This runs the same dry run on push to this branch, commits nothing, and
# uploads the flattened sheets so the labels can be corrected from them.

on:
  push:
    branches: [claude/prison-capacity-tracker-ed4v76]

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Read the bulletin, writing nothing
        run: python etl/prison_capacity.py --dry-run
      # The artifact blob host is unreachable from the environment reviewing
      # this, so the dump is printed here as well as uploaded.
      - name: Print the sheet dump
        if: always()
        run: cat data/_sheet-dump.json

      - name: Upload the sheet dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prison-bulletin-sheet-dump
          path: data/_sheet-dump.json
          if-no-files-found: warn
