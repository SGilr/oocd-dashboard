name: Checks

# Runs on every push and pull request. The site is built against the synthetic
# fixtures, because the Home Office files are not committed and a pull request
# should not depend on gov.uk being reachable.

on:
  push:
    branches-ignore: []
  pull_request:

permissions:
  contents: read

jobs:
  etl:
    name: ETL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest etl/tests -q
      - name: Pipeline against fixtures
        run: |
          python etl/make_fixtures.py
          python etl/transform.py --data-root fixture
          python etl/validate.py --data-root fixture
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-processed
          path: data/fixture/processed

  site:
    name: Site
    runs-on: ubuntu-latest
    needs: etl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: pip install -e ".[dev]"
      - name: Build the fixture data the site needs
        run: |
          python etl/make_fixtures.py
          python etl/transform.py --data-root fixture
          python etl/validate.py --data-root fixture
      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Confirm the build is marked as fixture data
        working-directory: site
        run: |
          grep -q "These figures are not real" dist/index.html
          echo "The fixture banner is present, as it must be on a fixture build."
