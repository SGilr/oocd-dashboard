# Figures the derived tables are checked against.
#
# validate.py fails the build when a derived figure differs from its target by
# more than the stated tolerance. There are two kinds of target and they are not
# equally strong.
#
#   kind: published
#     A figure the Home Office states in a bulletin. This is the only kind that
#     can catch a misreading of what the data means, because it comes from
#     outside the open data tables. At least one is required before a build on
#     live data will pass.
#
#   kind: recomputation
#     The same source computed by a different route, for example a pivot table
#     built by hand in Excel. This catches implementation error, which is most
#     of what goes wrong, but it cannot catch a misunderstanding shared by both
#     routes. Useful, and not a substitute for the above.
#
# Fields
#   id             stable identifier
#   kind           published or recomputation
#   financial_year the financial year the figure covers
#   measure        one of: oocd_total, charge_total, positive_total,
#                  assigned_total
#   basis          closed or recorded
#   fraud_variant  all or ex_fraud
#   value          the figure
#   tolerance_pct  permitted difference, as a percentage of the figure
#   citation       Harvard reference, or how the recomputation was produced
#   source_url     where the figure can be checked

targets:
  - id: charge-total-2025-26-recomputed
    kind: recomputation
    financial_year: 2025/26
    measure: charge_total
    basis: recorded
    fraud_variant: all
    value: 447514
    tolerance_pct: 0.01
    citation: >-
      Pivot table of the outcomes open data file for the year ending March 2026,
      built independently in Excel, summing the recorded quarter column by
      outcome group. Charged/Summonsed row.
    source_url: https://www.gov.uk/government/statistical-data-sets/police-recorded-crime-and-outcomes-open-data-tables

  - id: oocd-total-2025-26-recomputed
    kind: recomputation
    financial_year: 2025/26
    measure: oocd_total
    basis: recorded
    fraud_variant: all
    value: 240486
    tolerance_pct: 0.01
    citation: >-
      Pivot table as above, summing the three out of court rows the Home Office
      groups separately: Out-of-court (formal) 42,474, Out-of-court (informal)
      174,735, and diversionary, educational or intervention activity 23,277.
      Their sum is exactly the six outcome types this dashboard counts, which is
      an independent confirmation of the classification.
    source_url: https://www.gov.uk/government/statistical-data-sets/police-recorded-crime-and-outcomes-open-data-tables

  - id: charge-total-2025-26-published
    kind: published
    financial_year: 2025/26
    measure: charge_total
    basis: recorded
    fraud_variant: all
    value: 447514
    tolerance_pct: 0.01
    citation: >-
      Home Office (2026) Crime outcomes in England and Wales 2025 to 2026,
      Table 3.1, number of outcomes assigned by offence type and outcome group,
      year ending March 2026. London: Home Office. The charged or summonsed
      column, total victim offences 319,984 plus total state offences 127,530.
      The table states that it counts crimes recorded in the year, which is the
      recorded basis, that it covers all 44 forces including British Transport
      Police, and that it excludes fraud and Computer Misuse Act offences.
    source_url: https://www.gov.uk/government/statistics/crime-outcomes-in-england-and-wales-2025-to-2026/crime-outcomes-in-england-and-wales-2025-to-2026

  - id: out-of-court-formal-informal-2025-26-published
    kind: published
    financial_year: 2025/26
    measure: outcome_types
    outcome_types: [2, 3, 6, 7, 8]
    basis: recorded
    fraud_variant: all
    value: 217209
    tolerance_pct: 0.01
    citation: >-
      Home Office (2026) Crime outcomes in England and Wales 2025 to 2026,
      Table 3.1, as above. The out-of-court formal and informal column, total
      victim offences 111,286 plus total state offences 105,923. That column
      covers outcome types 2, 3, 6, 7 and 8. Outcome 22 is grouped separately by
      the Home Office and so is excluded from this target, which is why the
      target names its outcome types rather than using the dashboard's own out
      of court total.
    source_url: https://www.gov.uk/government/statistics/crime-outcomes-in-england-and-wales-2025-to-2026/crime-outcomes-in-england-and-wales-2025-to-2026
