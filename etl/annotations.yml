# Caveats that apply to the published series.
#
# This file is the single source of truth for every caveat on the site. Adding
# one is a change to this file alone: it appears as a numbered footnote marker
# on any chart it touches, and in full on the methodology page.
#
# Fields
#   id                    stable identifier, used in the footnote anchor
#   scope                 "national", or a list of canonical force names
#   financial_years       list of financial years affected, or "all"
#   measures              which measures the marker attaches to, or "all"
#   label                 short text for the chart footnote
#   text                  the full statement, shown on the methodology page
#   source_url            where the claim can be checked
#   source_citation       Harvard reference for the methodology page
#   source_url_verified   true, false or null. null means not yet checked.
#   needs_review          set when the note makes a claim that has not been
#                         reconciled with the data, or with a named source.
#                         validate.py flags it and the site marks it.
#
# Run `python etl/validate.py --check-urls` to resolve every source_url and
# write the result back into the validation report. Nothing is published as
# verified until that has run somewhere with network access to the sources.

version: 2
last_reviewed: 2026-08-26

annotations:
  - id: outcome-22-recording-change
    scope: national
    financial_years:
      - 2018/19
      - 2019/20
      - 2020/21
    measures: all
    label: Outcome 22 recording was voluntary before 2021/22
    text: >-
      Outcome 22, diversionary, educational or intervention activity, was
      available for voluntary recording from April 2019 and became compulsory
      from April 2021. A series that crosses that boundary compares forces that
      recorded the outcome with forces that did not, so differences between
      forces before 2021/22 may reflect recording practice rather than
      decision making. Charts shade the period before 2021/22 wherever outcome
      22 is shown.
    source_url: https://www.gov.uk/government/statistics/police-recorded-crime-open-data-tables/police-recorded-crime-and-outcomes-open-data-tables-user-guide
    source_citation: >-
      Home Office (2026) Police recorded crime and outcomes open data tables
      user guide. London: Home Office.
    source_url_verified: null

  - id: west-yorkshire-restricted-disposals
    scope:
      - West Yorkshire
    financial_years: all
    measures: all
    needs_review: true
    label: West Yorkshire issues almost no penalty notices or cannabis warnings
    text: >-
      West Yorkshire Police adopted a two tier model of out of court disposal,
      built around conditional cautions and community resolutions. In the year
      ending March 2026 the force recorded 4 penalty notices for disorder and 2
      cannabis or khat warnings, which is effectively none, so it should not be
      compared with other forces on those two types. It recorded 2,451 cautions
      in the same year, so any statement that the force does not issue cautions
      is not supported by the published data. See the note on caution types,
      which explains why a force that has withdrawn simple cautions still
      appears in the caution counts.
    source_url: https://www.westyorkshire-pcc.gov.uk/our-business/out-court-disposals.html
    source_citation: >-
      Office of the Police and Crime Commissioner for West Yorkshire (2024)
      Out of court disposals. Wakefield: West Yorkshire Police and Crime
      Commissioner.
    source_url_verified: null

  - id: centrally-recorded-fraud
    scope: national
    financial_years: all
    measures: all
    label: Fraud is recorded centrally and is absent from the outcomes tables
    text: >-
      Fraud reported to Action Fraud, Cifas and Financial Fraud UK is recorded
      centrally rather than by police forces. In the year ending March 2026 the
      only fraud offence group in the outcomes tables is "Fraud offences to
      2012/13", every code in it is expired, and it carries no counts, so the
      outcomes tables contain effectively no fraud at all. Excluding fraud
      therefore changes nothing in any measure built on outcomes, and the
      exclude fraud control is kept so that this can be seen rather than assumed.
      Fraud does affect the police force area crime tables, which supply the
      denominator for the rate per 1,000 recorded crimes, so it matters for that
      measure and not for the share measures.
    source_url: https://www.gov.uk/government/statistics/police-recorded-crime-open-data-tables/police-recorded-crime-and-outcomes-open-data-tables-user-guide
    source_citation: >-
      Home Office (2026) Police recorded crime and outcomes open data tables
      user guide. London: Home Office.
    source_url_verified: null

  - id: btp-no-resident-population
    scope:
      - British Transport Police
    financial_years: all
    measures:
      - rate_per_1000_recorded_crime
    label: British Transport Police has no resident population
    text: >-
      British Transport Police polices the railway network across England,
      Wales and Scotland rather than a geographical area with residents. It has
      no resident population and a distinct offence profile, so it is excluded
      by default from measures that normalise for force size. It remains in
      share based measures, where the denominator is the force's own outcomes.
    source_url: https://www.btp.police.uk/police-forces/british-transport-police/areas/about-us/about-us/
    source_citation: >-
      British Transport Police (2026) About us. London: British Transport
      Police.
    source_url_verified: null

  - id: offence-code-expiry
    scope: national
    financial_years: all
    measures: all
    label: Some offence codes expire during the series
    text: >-
      Offence codes are added and retired across the period. The published
      tables carry an offence code expired flag, and the extract reads that
      flag rather than assuming a stable code list. Comparisons of a single
      offence over the whole series may therefore be comparing different code
      sets. Offence group totals are unaffected, because retired codes are
      mapped into the same groups.
    source_url: https://www.gov.uk/government/statistics/police-recorded-crime-open-data-tables/police-recorded-crime-and-outcomes-open-data-tables-user-guide
    source_citation: >-
      Home Office (2026) Police recorded crime and outcomes open data tables
      user guide. London: Home Office.
    source_url_verified: null

  - id: caution-types-not-separable
    scope: national
    financial_years: all
    measures: all
    label: Simple and conditional cautions cannot be told apart
    text: >-
      Outcome types 2 and 3 count cautions of youths and of adults. They do not
      distinguish a simple caution from a conditional caution, and the published
      tables carry nothing that would allow the two to be separated. A force
      that has withdrawn simple cautions as a matter of policy, but continues to
      issue conditional cautions, still shows a large caution count here. Any
      reading of these series as evidence about simple cautions specifically is
      unsupported.
    source_url: https://www.gov.uk/government/statistics/police-recorded-crime-open-data-tables/police-recorded-crime-and-outcomes-open-data-tables-user-guide
    source_citation: >-
      Home Office (2026) Police recorded crime and outcomes open data tables
      user guide. London: Home Office.
    source_url_verified: null

  - id: not-yet-assigned-excluded
    scope: national
    financial_years: all
    measures: all
    label: Offences with no outcome yet are excluded from every total
    text: >-
      The published tables carry outcome type 0, not yet assigned an outcome,
      as a row like any other. It is not an outcome, it counts offences still
      waiting for one, and it is excluded from every figure on this dashboard.
      Including it in all assigned outcomes would put undecided cases into the
      denominator of measures about decisions. In the year ending March 2026 it
      covered 384,808 offences on the recorded basis, which would have inflated
      that denominator by about 8 per cent. It has no counts at all on the
      closed basis, which is one more reason the closed basis is the default.
    source_url: https://www.gov.uk/government/statistics/police-recorded-crime-open-data-tables/police-recorded-crime-and-outcomes-open-data-tables-user-guide
    source_citation: >-
      Home Office (2026) Police recorded crime and outcomes open data tables
      user guide. London: Home Office.
    source_url_verified: null
